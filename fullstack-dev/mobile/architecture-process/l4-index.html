# Maturity Level 4: Architecture & Coding Guidance

**Area:** Architecture Definition
**Practice:** Architecture & Coding Guidance
**Phase:** DEVELOPMENT (Sprint 1-N)
**Index:** 130

---

### Criteria

"Technical debts are aware every interation and planned to reduce."

### E-commerce App Context (Flutter)

This practice is about making technical debt visible and actionable, rather than letting it hide in the codebase until it becomes a major problem. For a Flutter e-commerce app, this could be code that was rushed for a product launch (e.g., a hardcoded promotion banner) or a suboptimal state management pattern that is now causing bugs in the cart.

### How to Achieve This (Flutter/E-commerce)

#### 1. Required Tooling

* **Project Management Tool:** Jira, Trello, or similar.
* **IDE:** VS Code with extensions that can highlight \`TODO\` comments (e.g., "Todo Tree").
* **Team Rituals:** Sprint Planning, Retrospective.

#### 2. Implementation Steps

1.  **Step 1: Create a "TechDebt" Label**
    * In your Jira project, create a new label (or issue type) named \`TechDebt\`. This is the central "bucket" for all known debt.

2.  **Step 2: Standardize In-Code Comments**
    * Establish a team convention for marking debt *as it's being created*.
    * **Convention:** \`// TODO(TechDebt): [Brief description of the debt and why it exists]\`
    * **Example:** \`// TODO(TechDebt): Hardcoded 'BFCM2025' promo code. Needs to be moved to Remote Config.\`

3.  **Step 3: Establish the "Tech Debt Review" Ritual**
    * This is the most important step. Add a 15-minute standing agenda item to your **Sprint Retrospective**.
    * **Agenda Item:** "Tech Debt Review."
    * During this time, the Tech Lead (or a rotating "Debt Watcher") does two things:
        * Uses their IDE's search or "Todo Tree" extension to find all new \`TODO(TechDebt)\` comments added in the last sprint.
        * Presents any "code smells" or suboptimal patterns they noticed during code reviews.

4.  **Step 4: Triage and Plan**
    * For each piece of debt identified, the team makes a quick group decision:
        * **Option A: "Quick Fix" (1-2 hours):** The developer who introduced it (if available) creates a task and tries to fix it in the *next* sprint.
        * **Option B: "Significant Refactor" (> 2 hours):** The Tech Lead creates a new \`TechDebt\` story in the backlog, adds the \`TechDebt\` label, and links the relevant code.
        * **Option C: "Acceptable Debt":** The team agrees the debt is low-impact and not worth fixing right now. The comment remains, but no story is created.

5.  **Step 5: Prioritize in Sprint Planning**
    * During **Sprint Planning**, the Product Owner and Tech Lead must explicitly allocate a percentage of the team's capacity (e.g., 10-15%) to working on stories from the \`TechDebt\` backlog. This ensures debt is *actually* paid down and not just tracked.

# Maturity Level 4: Communication & Alignment

**Area:** Architecture Definition
**Practice:** Communication & Alignment
**Phase:** DEVELOPMENT (Sprint 1-N)
**Index:** 131

---

### Criteria

"There are rituals or meetings to share experiences about DevOps (kaizen meetings, C&A, follow-up meetings)."

### E-commerce App Context (Flutter)

This is about creating a formal, recurring time for the team to discuss and improve the "factory floor"—the tools and processes they use to build and ship the app. For a Flutter team, this focuses heavily on build times, CI/CD pipelines (\`fastlane\`, GitHub Actions), and developer environment friction. It's a "Kaizen" (continuous improvement) meeting for your engineering system.

### How to Achieve This (Flutter/E-commerce)

#### 1. Establish the Ritual

* **Name:** "DevOps & Tooling Sync" or "Engineering Productivity Huddle."
* **Cadence:** Bi-weekly (every two weeks) for 45 minutes. It should *not* be part of a Sprint Retrospective, as it's more technical and forward-looking.
* **Attendees:** The entire development team (Flutter, Backend, QA) and the Tech Lead. The Product Owner is optional but welcome.

#### 2. Create a Shared Agenda Document

Create a simple, persistent document (Confluence, Notion, Google Doc) that anyone on the team can add to at any time.

**Agenda Template:**

1.  **Round Robin: "My Biggest Time Sink" (10 min)**
    * Each person quickly shares one thing that wasted their time in the last two weeks (e.g., "My iOS build failed and I spent 2 hours fixing certificates," "Our \`build_runner\` command took 5 minutes every time I changed a model").

2.  **Pipeline Metrics Review (5 min)**
    * The Tech Lead shares their screen and shows a dashboard (e.g., in GitHub Actions or Codemagic) of:
        * Average CI build time (per-PR).
        * Build success/failure rate.
        * Time to deploy to Firebase App Distribution.

3.  **New Ideas & Tooling (15 min)**
    * A space for "I saw this cool new tool..."
    * **Example:** "I read about the \`patrol\` testing framework. Should we try it?"
    * **Example:** "Flutter 3.XX just launched. When should we plan the upgrade?"

4.  **Action Item Review & Assignment (15 min)**
    * Review action items from the *last* meeting.
    * Create new action items based on today's discussion (e.g., "ACTION: [Dev's Name] to investigate caching \`build_runner\` output in CI").

#### 3. Foster a "Continuous Improvement" Culture

* The Tech Lead must champion this. When someone complains about a slow process in Slack, the response should be: "That's a great point. Can you add it to the agenda for the DevOps Sync?"
* This meeting formalizes that feedback loop and ensures improvements are tracked and executed.

# Maturity Level 4: Communication & Alignment

**Area:** Architecture Definition
**Practice:** Communication & Alignment
**Phase:** SETUP
**Index:** 132

---

### Criteria

"The DevOps lifecycle has been established and discussed with the team and the project sponsors."

### E-commerce App Context (Flutter)

This item is about creating a single, simple diagram that explains your entire "code to customer" pipeline. This is a crucial alignment tool for onboarding new developers and explaining your release process to non-technical stakeholders (like project sponsors or Product Owners) so they understand *why* it takes a certain amount of time to release a feature.

### How to Achieve This (Flutter/E-commerce)

#### 1. Tooling

* **Diagramming Tool:** Mermaid (for markdown), Miro, Lucidchart, or even just PowerPoint.

#### 2. Create the "Path to Production" Diagram

Create a visual flow diagram. It must be simple enough for a non-technical person to understand.

**Example Diagram Flow:**

1.  **[Developer Laptop]**
    * Developer writes code on a \`feature/P-123-add-to-cart\` branch.
    * Pushes to **GitHub**.

2.  **[GitHub]**
    * Developer opens a **Pull Request (PR)** against the \`main\` branch.

3.  **[GitHub Actions (CI)]** - *Automated*
    * A workflow triggers automatically:
    * **Lint & Analyze:** \`flutter analyze\`
    * **Test:** \`flutter test\` (Unit & Widget Tests)
    * **Build:** \`flutter build apk\` and \`flutter build ipa\` (to ensure code compiles)

4.  **[GitHub]**
    * PR requires at least one developer **approval**.
    * PR is **merged** to \`main\`.

5.  **[GitHub Actions (CD)]** - *Automated*
    * The merge to \`main\` triggers a *new* workflow:
    * **Build & Deploy (Dev):** Builds the "Dev" version of the app and automatically deploys it to **Firebase App Distribution** (in a "Developers" group).

6.  **[Firebase App Distribution]**
    * **Internal Testing (QA):**
    * A developer *manually* triggers a workflow to deploy the \`main\` branch to the "QA" group.
    * QA team tests the app on real devices.

7.  **[GitHub & App Stores]** - *Manual "Release Day" Step*
    * **Step 7a (GitHub):** Tech Lead creates a \`release/v1.2.0\` branch from \`main\`.
    * **Step 7b (CI/CD):** A workflow *manually* triggered on this branch builds the **Production** app (\`--release\`), signs it, and uploads it to **TestFlight** and **Play Console Internal Testing**.
    * **Step 7c (App Stores):** After final checks, the team manually clicks "Promote to Production" in App Store Connect and Google Play Console.

#### 3. Discuss with Stakeholders

* **Team:** Walk every new developer through this diagram during their first week.
* **Sponsors/PO:** Use this diagram to explain:
    * "This is our quality process. Steps 3 and 6 are where we catch bugs."
    * "When you ask for a hotfix, this is the *minimum* process it must go through."
    * "Step 7c is the 'App Store Review' part we don't control, which can take 1-2 days."

# Maturity Level 4: Non-functional requirements

**Area:** Architecture Definition
**Practice:** Non-functional requirements
**Phase:** SETUP
**Index:** 133

---

### Criteria

"There is a target for the NFR metrics. The target is defined and documented."

### E-commerce App Context (Flutter)

This is about moving from vague goals like "the app should be fast" to a specific, measurable contract. For an e-commerce app, this is critical. A 100ms delay in page load can directly impact conversion rates and revenue. You must define *what* "good" means in numbers.

### How to Achieve This (Flutter/E-commerce)

#### 1. Required Tooling

* **Monitoring Tools:** Firebase (Crashlytics, Performance Monitoring), Sentry, or similar.
* **Documentation Tool:** Confluence, Notion, or your team's wiki.

#### 2. Implementation Steps

1.  **Step 1: Identify Key NFR Categories**
    * For your e-commerce app, the most important categories are:
        * **Reliability:** How often it crashes.
        * **Performance:** How fast it feels.
        * **Maintainability:** How easy it is to add features and fix bugs.

2.  **Step 2: Define Specific, Measurable Targets**
    * For each category, define a metric, a target, and the tool you will use to measure it.

3.  **Step 3: Create the NFR Target Document**
    * Create a page in your team's wiki named "E-commerce App: NFR Targets" and add this table.

| Category | NFR Metric | Target | How to Measure (Tool) |
| :--- | :--- | :--- | :--- |
| **Reliability** | Crash-Free User Rate | **> 99.9%** | Firebase Crashlytics |
| **Performance** | Cold App Startup (P90) | **< 2.5 seconds** | Firebase Performance |
| **Performance** | Home Screen Load Time (P95) | **< 600ms** | Firebase Performance (Custom Trace) |
| **Performance** | Product Detail Page Load (P95)| **< 400ms** | Firebase Performance (Custom Trace) |
| **Performance** | API Response Time (P95) | **< 500ms** | Backend Monitoring (e.g., Datadog) |
| **Maintainability** | Code Coverage (on new code) | **> 70%** | \`lcov\` report / SonarQube |
| **Maintainability** | Static Analysis Issues | **0 new** | \`flutter analyze\` (in CI) |

4.  **Step 4: Get Stakeholder Buy-In**
    * **This is the most important part.** Review this table with your Product Owner and Project Sponsors.
    * You must explain the **trade-offs**.
    * **Example Script:** "To achieve a \`< 2.5s\` app start time, we may need to spend 2-3 sprints on performance optimization instead of new features. Do we all agree this is the priority?"
    * Once agreed, this document becomes part of your "Definition of Done." A feature isn't "done" if it makes the P95 Home Screen Load Time jump to 1500ms.

# Maturity Level 4: Technical Refinement & Design

**Area:** Architecture Definition
**Practice:** Technical Refinement & Design
**Phase:** DEVELOPMENT (Sprint 1-N)
**Index:** 134

---

### Criteria

"The technical refinement document is very well structured; The team understands it and will rarely get blocked due lack of details in the technical refinement; Continuous improvements are applied to the document through immediate feedback."

### E-commerce App Context (Flutter)

This is about creating a standard template for a "Technical Design Doc" or "Tech Refinement." When a Product Owner hands you a complex User Story (e.g., "Implement a new multi-step checkout flow"), the development team needs to create a plan *before* writing code. This plan is the technical refinement document. A good one prevents developers from getting blocked halfway through a sprint.

### How to Achieve This (Flutter/E-commerce)

#### 1. Create the Tech Refinement Template

Create a template in your team's wiki (Confluence, Notion) and link it directly from your User Stories in Jira. When a story is large, the team *must* fill this out *before* the sprint starts.

**Template: Technical Refinement Doc**

1.  **Story:** [Link to Jira User Story]
2.  **Authors:** [Names of developers involved in refinement]
3.  **Date:** [Date of refinement]

---

4.  **Problem Statement & Goals**
    * *What is the user trying to accomplish? What is the business goal?*
    * (e.g., "Users need to enter shipping, billing, and payment info in three separate steps. The goal is to reduce cognitive load and improve checkout conversion.")

5.  **Proposed Solution**
    * *This is the core of the doc. What is our plan?*
    * **UI/Widgets:**
        * What new *reusable* widgets will be created? (e.g., \`StepIndicator\`, \`AddressForm\`)
        * What existing widgets will be modified?
    * **State Management:**
        * What state manager will be used? (e.g., Riverpod, BLoC)
        * What is the state class? (e.g., \`CheckoutState\` containing \`shippingAddress\`, \`paymentMethod\`, \`currentStep\`)
        * What events/functions will modify the state? (e.g., \`onNextStep()\`, \`onShippingAddressSaved(address)\`)
    * **Data & API:**
        * What *new* API endpoints will we need from the backend? (e.g., \`POST /v2/checkout/save-address\`)
        * What *existing* API endpoints will be used?
        * What new data models/classes will be created in Flutter? (e.g., \`AddressModel\`, \`PaymentMethodModel\`)
    * **Diagram (Optional but Recommended):**
        * (A simple flowchart or state diagram showing the user's path through the new flow).

6.  **Out of Scope / Non-Goals**
    * *What are we explicitly NOT doing?*
    * (e.g., "This does *not* include support for 'Buy Now, Pay Later' (BNPL) payment methods. That will be a separate story.")

7.  **Alternatives Considered**
    * *What other approaches did we discuss? Why did we reject them?*
    * (e.g., "We considered a single-page checkout but decided against it, as PO feedback indicated our users prefer a stepped process.")

8.  **Open Questions & Blockers**
    * *What do we still need to know?*
    * (e.g., "Q: What payment processor will we use for credit cards? **Blocked until backend team confirms.**")

#### 2. The Process

1.  **Before Sprint Planning:** The Tech Lead and 1-2 devs pick the biggest stories for the *next* sprint and fill out this template.
2.  **During Sprint Planning:** The team presents this doc to the group to get feedback, spot new problems, and finalize task breakdown.
3.  **During the Sprint:** Developers are *rarely* blocked because the plan is clear and questions were answered *before* the sprint began.
`,

# Maturity Level 4: Continuous Deployment

**Area:** Architecture Execution
**Practice:** Continuous Deployment
**Phase:** PREPARATION (Sprint 0)
**Index:** 135

---

### Criteria

"The deployment to the pre-production environment is automated and executed in a CI/CD server (Jenkins, Azure DevOps, etc)."

### E-commerce App Context (Flutter)

This means having a dedicated "Staging" or "Pre-Prod" environment that perfectly mirrors Production. Deployment to this environment should be fully automated and *not* require a developer to run build commands on their local machine. This environment is for the final "go/no-go" decision from the Product Owner and QA team before releasing to the public.

### How to Achieve This (Flutter/E-commerce)

#### 1. Required Tooling

* **CI/CD Server:** GitHub Actions, Codemagic, Azure DevOps, or Jenkins.
* **Distribution:** Firebase App Distribution (recommended) or TestFlight/Play Console Internal Testing.
* **Git Strategy:** A branch to deploy from (e.g., \`staging\` or \`release/*\`).

#### 2. Implementation Steps

1.  **Step 1: Create a "Staging" Environment**
    * This includes:
        * A separate Firebase project (e.g., \`my-ecommerce-app-staging\`).
        * A "Staging" flavor/target in your Flutter app, configured with the staging project's \`google-services.json\` and a different \`dart-define\` file for the staging backend API.
        * A "Staging" group in Firebase App Distribution.

2.  **Step 2: Define a Triggering Branch**
    * Choose a branch strategy. A common one is using a \`staging\` branch.
    * **Flow:** Developers merge \`main\` into \`staging\` when they are "feature complete" for a release.

3.  **Step 3: Create the "Deploy to Staging" CI/CD Workflow**
    * In your CI/CD tool (e.g., GitHub Actions), create a new workflow file (e.g., \`deploy-staging.yml\`).
    * **Trigger:** \`on: push: branches: [ staging ]\` (Triggers automatically when the \`staging\` branch is updated).
    * **Workflow Steps:**
        1.  **Checkout Code:** \`actions/checkout\`
        2.  **Set up Flutter:** \`subosito/flutter-action\`
        3.  **Install \`fastlane\`** (if you use it for signing/deployment)
        4.  **Decrypt Secrets:** Decrypt your Android Keystore and iOS Distribution Certificate (stored as encrypted secrets in the CI/CD server).
        5.  **Build Android (Staging):**
            * \`flutter build apk --flavor staging --dart-define=BACKEND_URL=https://api.staging.my-app.com\`
        6.  **Deploy to Firebase (Android):**
            * Use the \`firebase-app-distribution-action\` (or \`fastlane\`) to upload the staging APK to the "Staging" tester group.
        7.  **Build iOS (Staging):**
            * \`flutter build ipa --flavor staging --dart-define=BACKEND_URL=https://api.staging.my-app.com\`
        8.  **Deploy to Firebase (iOS):**
            * Upload the staging IPA to the "Staging" tester group.
        9.  **Notify Team:** Post a message to a Slack channel: "✅ New Staging build (v1.2.3) is available for testing in Firebase."

4.  **Step 4: The Process**
    * Now, no developer builds the "Staging" app locally.
    * To get a new build to the QA team, a developer simply merges the \`main\` branch into \`staging\`.
    * The CI/CD server handles the entire build, sign, and deploy process automatically. This is a "one-click" deployment to pre-production.
`,

# Maturity Level 4: Continuous Deployment

**Area:** Architecture Execution
**Practice:** Continuous Deployment
**Phase:** DEVELOPMENT (Sprint 1-N)
**Index:** 136

---

### Criteria

"It is possible to check the deployment status through smoking test scripts."

### E-commerce App Context (Flutter)

A "smoke test" is a basic, automated test that runs *after* deployment to ensure the app isn't fundamentally broken. It answers the question, "Did the deployment work?" For an e-commerce app, a good smoke test would be: "Can the app start, log in, and load the home screen?" If it fails, the build is marked as "bad" immediately.

### How to Achieve This (Flutter/E-commerce)

#### 1. Required Tooling

* **UI Testing Framework:** **Patrol** (recommended) or \`flutter_driver\` + \`integration_test\`.
* **CI/CD Server:** GitHub Actions, Codemagic, etc.
* **Device Farm (Optional but best):** Firebase Test Lab, AWS Device Farm, or BrowserStack.

#### 2. Implementation Steps

1.  **Step 1: Write the Smoke Test Script**
    * Using **Patrol**, create a new test file (e.g., \`test/smoke_test.dart\`).
    * This test should be simple and fast. It should *not* test business logic, only that the core app flow is functional.

    \`\`\`dart
    // Example using Patrol framework
    import 'package:flutter_test/flutter_test.dart';
    import 'package:patrol/patrol.dart';
    import 'package:my_ecommerce_app/main.dart' as app; // Your app's entry
    
    void main() {
      patrolTest(
        'Smoke Test: App Login and Home Screen',
        (PatrolIntegrationTester $) async {
          await app.main(); // Start the app
          await $.pumpAndSettle(); // Wait for app to load

          // 1. Find and tap the "Login" button
          await $(#loginButton).tap();
          await $.pumpAndSettle();

          // 2. Enter credentials (use environment variables)
          await $(#emailField).enterText(PatrolTester.env['TEST_USER_EMAIL']);
          await $(#passwordField).enterText(PatrolTester.env['TEST_USER_PASS']);
          await $(#submitLoginButton).tap();
          await $.pumpAndSettle(timeout: Duration(seconds: 10)); // Wait for network

          // 3. Verify we are on the Home Screen
          // This confirms login worked and the home screen loaded.
          expect($(#homeScreenTitle), findsOneWidget); 
          expect($(#productCarousel), findsOneWidget);
        },
      );
    }
    \`\`\`

2.  **Step 2: Integrate into CI/CD Pipeline**
    * This test should run as a *post-deploy* step.
    * **Flow:**
        1.  CI/CD builds and deploys the "Dev" app to Firebase App Distribution (from Item 135).
        2.  **New Step:** The CI/CD job *then* triggers the smoke test.

    * **Option A (Device Farm - Recommended):**
        * Your CI/CD job uses the Firebase CLI to upload your test script and the newly-built APK/IPA to **Firebase Test Lab**.
        * Test Lab runs your \`smoke_test.dart\` on a real, physical device.
        * The CI/CD job waits for Test Lab to return "PASS" or "FAIL".

    * **Option B (Emulator - Good):**
        * Your CI/CD job starts an Android emulator.
        * It runs \`patrol_cli test --target=test/smoke_test.dart\` (or the \`flutter_driver\` equivalent) inside the emulator.
        * It waits for the test to pass or fail.

3.  **Step 3: Alert on Failure**
    * If the smoke test *fails*, the CI/CD job must:
        1.  Mark the entire build/deployment as "FAILED".
        2.  Send an urgent alert to the team's Slack channel: "Smoke test failed for build 1.2.4. App may be broken."
        3.  (Advanced) Automatically roll back the deployment or mark it as "bad".
`,

# Maturity Level 4: Continuous Deployment

**Area:** Architecture Execution
**Practice:** Continuous Deployment
**Phase:** PREPARATION (Sprint 0)
**Index:** 137

---

### Criteria

"The deployment can be executed in a single click for Production environment."

### E-commerce App Context (Flutter)

This means the "Release Day" process of building, signing, and uploading your *production* app to App Store Connect and the Google Play Console should be 100% automated and triggered by a single action (like a Git tag, a branch merge, or a manual "run workflow" button in your CI/CD server). This eliminates human error, like a developer building the app with the wrong \`dart-define\` or signing it with a debug key.

### How to Achieve This (Flutter/E-commerce)

#### 1. Required Tooling

* **CI/CD Server:** GitHub Actions, Codemagic, Azure DevOps, Jenkins.
* **Automation Tool:** **fastlane** (highly recommended for handling iOS/Android certificates and uploads).
* **Git Strategy:** A \`release/*\` branch or Git tags (e.g., \`v1.2.0\`).

#### 2. Implementation Steps

1.  **Step 1: Set Up \`fastlane\` (The Core)**
    * \`fastlane\` is a tool that automates the complex parts of mobile deployment.
    * You will create a \`Fastfile\` in both your \`android\` and \`ios\` directories.
    * **\`ios/fastlane/Fastfile\`:**
        * Create a "lane" called \`release_to_testflight\`.
        * This lane will:
            1.  Call \`match\` to fetch your production certificates and provisioning profiles from a secure Git repo (this is \`fastlane match\`).
            2.  Run \`flutter build ipa --release --flavor production ...\`
            3.  Call \`upload_to_testflight\` to send the IPA to App Store Connect.
    * **\`android/fastlane/Fastfile\`:**
        * Create a "lane" called \`release_to_internal_testing\`.
        * This lane will:
            1.  Run \`flutter build appbundle --release --flavor production ...\`
            2.  Call \`upload_to_play_store\` to send the App Bundle (AAB) to the Play Console (e.g., to the "Internal Testing" track).

2.  **Step 2: Store All Secrets in CI/CD**
    * Your Android Keystore, Keystore password, App Store Connect API key, etc., must be stored as **encrypted secrets** in your CI/CD server (e.g., GitHub Secrets).
    * **Never** commit these to your repository.

3.  **Step 3: Create the "One-Click" CI/CD Workflow**
    * In your CI/CD tool, create a new workflow (e.g., \`release-production.yml\`).
    * **Trigger:** This workflow should *NOT* be automatic. It should be a \`workflow_dispatch\`. This adds a "Run workflow" button in the GitHub Actions UI.
    * **Workflow Steps:**
        1.  **Checkout Code:** \`actions/checkout\`
        2.  **Set up Flutter:** \`subosito/flutter-action\`
        3.  **Install \`fastlane\`**
        4.  **Decrypt Secrets:** Securely load your Keystore and API keys into the environment.
        5.  **Run Android Release:** \`cd android && fastlane release_to_internal_testing\`
        6.  **Run iOS Release:** \`cd ios && fastlane release_to_testflight\`
        7.  **Notify Team:** Post to Slack: "🚀 Production build v1.2.0 has been successfully uploaded to TestFlight and Play Console. Ready for final review."

4.  **Step 4: The Process**
    * When the team is ready to release:
        1.  The Tech Lead creates the \`release/v1.2.0\` branch.
        2.  They go to the GitHub Actions tab.
        3.  They select the "Deploy to Production" workflow.
        4.  They select the \`release/v1.2.0\` branch.
        5.  They **click the "Run workflow" button.**
    * 45 minutes later, the builds are in the app stores, ready for final rollout. This is the "single click."
`,

# Maturity Level 4: Continuous Deployment

**Area:** Architecture Execution
**Practice:** Continuous Deployment
**Phase:** PREPARATION (Sprint 0)
**Index:** 138

---

### Criteria

"The rollback can be executed in a single click for Production environment."

### E-commerce App Context (Flutter)

This item is about your **emergency plan**. A new production version (v1.3.0) is released and is causing a critical bug (e.g., "checkout is crashing for 10% of users"). You need a fast, simple, documented way to revert *all* users back to the previous stable version (v1.2.0).

**Note:** For mobile apps, a "one-click" rollback is different from web. You cannot instantly "un-deploy" code from a user's phone. This item refers to **using the App Store/Play Console to promote a previous, stable version** to 100% of users, which forces a "downgrade" update.

### How to Achieve This (Flutter/E-commerce)

#### 1. Prerequisite: Staged Rollouts

* You must be using **staged rollouts** in both the App Store and Play Console.
* **Process:** When you release \`v1.3.0\`, you release it to 1% of users, then 5%, then 20%, etc., over several days, while monitoring for crashes (see Item 144). This gives you a chance to *catch* the bug before it hits 100% of users.

#### 2. The "Rollback" Procedure (What to Document)

This is a **process to be documented** in your team's wiki, not a CI/CD script. Create a page called "Emergency Production Rollback Plan."

**Google Play Console (Android) Rollback:**

1.  Open the **Play Console** and select your app.
2.  Go to **Releases > Production**.
3.  Find your *current, bad* release (e.g., \`v1.3.0\`) that is rolling out.
4.  Click **"Halt rollout"**. This stops any new users from getting the bad version.
5.  Go to your **Release library**.
6.  Find the *previous, stable* version (e.g., \`v1.2.0\`).
7.  Click **"Promote release" > "Production"**.
8.  Confirm the rollout. This will start a *new* rollout, pushing \`v1.2.0\` to all users, including those who already got \`v1.3.0\`. They will be prompted to "update" (in reality, downgrade).

**App Store Connect (iOS) Rollback:**

1.  Open **App Store Connect** and select your app.
2.  Go to the **"App Store"** tab.
3.  On the left, under your app version, you will see your *current, bad* version (e.g., \`v1.3.0\`).
4.  Click **"Remove this version from sale"**. This immediately stops all new downloads.
5.  **Create a *new* version** (e.g., \`v1.3.1\`).
6.  Go to your CI/CD server and **find the build artifact (IPA) for the *previous, stable* version** (e.g., \`v1.2.0\`).
7.  **Upload this *old* build** to the *new* version (\`v1.3.1\`) using \`fastlane\` or the Transporter app.
    * **CRITICAL:** You must increment the build number. You cannot reuse an old build number. This is why it's better to **re-build from the old Git tag** with a new build number (e.g., \`v1.2.0-hotfix\`).
8.  Submit \`v1.3.1\` (which contains \`v1.2.0\`'s code) for **expedited review**.

#### 3. The "One-Click" Part

* The "one-click" for Android is literally the "Halt" and "Promote" buttons in the Play Console.
* The "one-click" for iOS is a "hotfix" CI/CD workflow (similar to Item 137) that:
    1.  Checks out the *previous* release's Git tag (e.g., \`v1.2.0\`).
    2.  Increments the build number.
    3.  Builds, signs, and uploads to TestFlight.
    * This makes the "Upload this old build" step a single click.
`,

# Maturity Level 4: Continuous Integration

**Area:** Architecture Execution
**Practice:** Continuous Integration
**Phase:** DEVELOPMENT (Sprint 1-N)
**Index:** 139

---

### Criteria

"When it is necessary to change some configuration in the server, this change is applied using scripts (the changes are not applied manually)."

### E-commerce App Context (Flutter)

This item is for your **backend and cloud infrastructure**. It means "No Click-Ops." No one should be logging into the Firebase, GCP, or AWS console to manually change a setting (e.g., "Oh, I'll just change that Cloud Function's memory limit by hand"). All infrastructure changes must be defined in code (IaC - Infrastructure as Code) and applied through a Git-based workflow.

### How to Achieve This (Flutter/E-commerce)

#### 1. Required Tooling

* **IaC Tool:** **Terraform** (most common) or **Pulumi**.
* **SCM:** A separate Git repository (e.g., \`my-ecommerce-infra\`).
* **CI/CD:** GitHub Actions (or your CI/CD server).

#### 2. Implementation Steps

1.  **Step 1: Choose Your Tool and Repo**
    * Create a new Git repo: \`my-ecommerce-infra\`.
    * Standardize on **Terraform**.

2.  **Step 2: Define ALL Infrastructure in Code**
    * Your Terraform files (\`.tf\`) should define *everything* your app needs:
        * **GCP/Firebase:**
            * Firebase projects (e.g., \`my-ecommerce-app-dev\`, \`my-ecommerce-app-prod\`).
            * Firebase Hosting settings.
            * Cloud Functions (their names, memory, triggers).
            * Firestore security rules (though these might be in your app repo).
            * Pub/Sub topics.
            * Secret Manager secrets.
        * **Backend (if on Kubernetes):**
            * GKE/EKS cluster definitions.
            * Node pools.
            * Database instances (e.g., Cloud SQL).

3.  **Step 3: Create the Git-based Workflow (GitOps)**
    * This is the "no manual changes" part.
    * **Process:**
        1.  A backend developer needs to increase a Cloud Function's memory.
        2.  They **do not** go to the GCP console.
        3.  They go to the \`my-ecommerce-infra\` repo and change one line:
            \`\`\`terraform
            resource "google_cloudfunctions_function" "my_function" {
              # ...
              available_memory_mb = 128  # Change this to 256
              # ...
            }
            \`\`\`
        4.  They open a **Pull Request**.
        5.  The PR triggers a CI/CD job that runs \`terraform plan\`. This shows a *preview* of the change, which is posted as a PR comment: \`~ 1 to change, 0 to add, 0 to destroy\`.
        6.  The Tech Lead **reviews and approves** the PR.
        7.  The PR is merged to \`main\`.
        8.  This merge triggers a *new* CI/CD job that runs \`terraform apply\`, which automatically applies the change to the real cloud environment.

4.  **Step 4: Enforce the Policy**
    * Set up **read-only permissions** in your GCP/AWS console for all developers.
    * Only a few "break-glass" admin accounts (and the CI/CD service account) should have write access.
    * This *forces* everyone to follow the GitOps workflow. It's impossible to make manual changes.
`,
        '140-Automated_Environment_Creation.md': `
# Maturity Level 4: Continuous Integration

**Area:** Architecture Execution
**Practice:** Continuous Integration
**Phase:** PREPARATION (Sprint 0)
**Index:** 140

---

### Criteria

"When a new environment needs to be created there are scripts that allow the team to do it automatically with no manual steps."

### E-commerce App Context (Flutter)

This builds directly on Item 139 (IaC). If your Product Owner says, "We just signed a huge partner and we need a dedicated 'Partner-UAT' environment for them to test against," you should be able to create this entire, isolated environment (backend, database, Firebase project) in hours, not weeks.

### How to Achieve This (Flutter/E-commerce)

#### 1. Required Tooling

* **IaC Tool:** **Terraform** (specifically, **Terraform Modules**).

#### 2. Implementation Steps

1.  **Step 1: Create a Reusable "Environment Module"**
    * This is the core concept. You don't just write one big \`main.tf\` file. You create a **Terraform Module** called \`environment\`.
    * This module is a "factory" or "cookie-cutter" for one complete environment.
    * **File:** \`my-ecommerce-infra/modules/environment/main.tf\`
    * This file defines *all* the resources for one environment, using *variables*:
        * \`google_project\` (with name \`my-app-$\{var.env_name\}\`)
        * \`google_cloud_sql_instance\` (with name \`db-$\{var.env_name\}\`)
        * \`google_cloudfunctions_function\` (all your app's functions, with names prefixed by \`$\{var.env_name\}\`)
        * \`firebase_project\`
        * \`google_secret_manager_secret\` (all your secrets)

    * **Variables File:** \`my-ecommerce-infra/modules/environment/variables.tf\`
        \`\`\`terraform
        variable "env_name" {
          type = string // e.g., "dev", "staging", "prod", "uat"
        }
        variable "db_tier" {
          type = string // e.g., "db-f1-micro" for dev, "db-n1-standard-4" for prod
        }
        variable "enable_autoscaling" {
          type = bool
        }
        \`\`\`

2.  **Step 2: Use "Workspaces" to Manage Environments**
    * Terraform has a feature called **Workspaces** to manage different states (dev, staging, prod) from the *same* set of code.
    * Your main \`main.tf\` file is now incredibly simple. It just *calls* your module.
    * **File:** \`my-ecommerce-infra/main.tf\`
        \`\`\`terraform
        # Get the current workspace name (e.g., "dev" or "prod")
        locals {
          env_name = terraform.workspace
          
          # Define settings for each environment
          env_settings = {
            dev = {
              db_tier            = "db-f1-micro"
              enable_autoscaling = false
            }
            staging = {
              db_tier            = "db-f1-micro"
              enable_autoscaling = false
            }
            prod = {
              db_tier            = "db-n1-standard-4"
              enable_autoscaling = true
            }
            # Add a "uat" environment here
            uat = {
              db_tier            = "db-f1-micro"
              enable_autoscaling = false
            }
          }
        }
        
        # Call the factory!
        module "my_app_environment" {
          source             = "./modules/environment"
          env_name           = local.env_name
          db_tier            = local.env_settings[local.env_name].db_tier
          enable_autoscaling = local.env_settings[local.env_name].enable_autoscaling
        }
        \`\`\`

3.  **Step 3: Create the New "UAT" Environment**
    * Now, when the PO asks for the "Partner-UAT" environment, the process is:
        1.  Developer adds the \`uat\` block to the \`env_settings\` map in \`main.tf\` (as shown above).
        2.  They run two commands:
            * \`terraform workspace new uat\` (Creates the new, empty workspace)
            * \`terraform apply\` (Terraform sees the \`uat\` settings and builds *all* resources for it).
    * With no manual steps, a complete, new environment is created in minutes.
`,
        '141-Automated_Infrastructure_Scaling.md': `
# Maturity Level 4: Continuous Integration

**Area:** Architecture Execution
**Practice:** Continuous Integration
**Phase:** PREPARATION (Sprint 0)
**Index:** 141

---

### Criteria

"It is possible to scale up or scale down the server resources automatically to respond to demand changes."

### E-commerce App Context (Flutter)

This is a critical infrastructure requirement for an e-commerce app, especially one that will have huge, sudden traffic spikes (e.g., during a Black Friday sale). Your backend services must be able to handle this load without crashing, and then scale *down* afterwards so you don't overpay for servers.

### How to Achieve This (Flutter/E-commerce)

This entirely depends on your backend architecture.

#### 1. Option A: Serverless (e.g., Firebase, GCP Cloud Functions) - The Easiest

If your backend consists of serverless functions, you get this *almost* for free.

* **How it works:** When your app gets a spike in traffic (e.g., thousands of users adding to cart), the cloud provider (GCP, AWS) automatically spins up *more instances* of your \`addToCart\` function to handle the load. When the traffic dies down, it scales them back down to zero.
* **What you need to configure:**
    * **Max Instances:** You *must* set a \`max_instances\` limit (e.g., \`1000\`) in your function's configuration (e.g., in your Terraform script from Item 139). This is a safety rail to prevent a bug or DDoS attack from costing you a million dollars.
    * **Database Scaling:** Your database (e.g., Firestore, Cloud SQL) must *also* be able to handle the load. For Firestore, this is automatic. For Cloud SQL, you need to ensure you've provisioned a large enough instance (this is often scaled manually) or are using an autoscaling version (like Cloud SQL Enterprise Plus).

#### 2. Option B: Kubernetes (e.g., GKE, EKS) - The Most Powerful

If your backend is a set of microservices running on Kubernetes, you need to configure two layers of autoscaling.

* **Layer 1: Horizontal Pod Autoscaler (HPA)**
    * **What it does:** Automatically increases or decreases the *number of pods* (copies of your \`cart-api\` service) based on a metric.
    * **How to configure (in your Kubernetes YAML/Terraform):**
        \`\`\`yaml
        apiVersion: autoscaling/v2
        kind: HorizontalPodAutoscaler
        metadata:
          name: cart-api-hpa
        spec:
          scaleTargetRef:
            apiVersion: apps/v1
            kind: Deployment
            name: cart-api
          minReplicas: 2  # Always keep at least 2 running
          maxReplicas: 50 # Scale up to 50 during Black Friday
          metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 80 # If CPU usage > 80%, add more pods
        \`\`\`

* **Layer 2: Cluster Autoscaler**
    * **What it does:** What if your 50 pods need more *machines* (nodes) to run on? The Cluster Autoscaler automatically adds more nodes (VMs) to your Kubernetes cluster when it's full, and removes them when they are empty.
    * **How to configure:** This is usually a setting you enable when you create your cluster in GKE or EKS.
`,
        '142-Infrastructure_Monitoring_Visibility.md': `
# Maturity Level 4: Continuous Monitoring

**Area:** Architecture Execution
**Practice:** Continuous Monitoring
**Phase:** RELEASE
**Index:** 142

---

### Criteria

"Everyone in the team can see the infrastructure monitoring metrics."

### E-commerce App Context (Flutter)

This is a transparency and culture item. It means that *all* developers (including Flutter devs) should have read-only access to the backend and infrastructure health dashboards. When a Flutter developer sees a bug in the app (e.g., "Product images are loading slowly"), their first instinct should be to check the dashboard. Can they see if the backend API error rate is spiking? Or if the CDN cache-hit ratio has dropped?

### How to Achieve This (Flutter/E-commerce)

#### 1. Required Tooling

* **Monitoring/APM Tool:** **Datadog**, **New Relic**, **Sentry** (for Performance), or the native cloud tools (**GCP Cloud Monitoring**, **AWS CloudWatch**).
* **Team Wiki:** Confluence, Notion, etc.

#### 2. Implementation Steps

1.  **Step 1: Create a "Key Metrics" Dashboard**
    * In your monitoring tool (e.g., Datadog), create *one* primary dashboard named **"[App Name] - Infrastructure Health"**.
    * This dashboard must be understandable by non-experts. Do not fill it with obscure metrics like \`kube-proxy-cpu-usage\`.
    * **Key Widgets to Include:**
        * **API Error Rate (P90/P95/P99):** A time-series graph of your API's 4xx and 5xx error rates. *This is the most important one.*
        * **API Latency (P90/P95/P99):** A time-series graph of how long your API takes to respond.
        * **Key Endpoint Monitoring:** Separate graphs for critical endpoints (e.g., \`POST /login\`, \`GET /home\`, \`POST /checkout\`).
        * **Database:** CPU utilization and slow query count.
        * **Kubernetes/Serverless:** Pod/Function counts and restart/crash loops.

2.  **Step 2: Grant Read-Only Access**
    * Go into your monitoring tool's IAM / User settings.
    * Create a "Developer" role that has **read-only access** to dashboards.
    * Invite your *entire* development team (all Flutter and backend devs) to the tool with this role.

3.  **Step 3: Make the Dashboard Visible**
    * **Get the "Share Link"** for the dashboard you created.
    * **Pin the link** in your team's main Slack/Teams channel.
    * **Add the link** to the top of your team's wiki homepage.
    * **During Onboarding:** Show every new developer this dashboard and explain what the key graphs mean.

4.  **Step 4: Use it in Triage**
    * When a bug is reported (e.g., "The app feels slow!"), the Tech Lead's first action should be to **paste a link to the dashboard** in the Slack thread, asking "Is anyone seeing a matching spike in API latency?" This trains the whole team to use the dashboard as the single source of truth.
`,
        '143-Infrastructure_Incident_Response.md': `
# Maturity Level 4: Continuous Monitoring

**Area:** Architecture Execution
**Practice:** Continuous Monitoring
**Phase:** RELEASE
**Index:** 143

---

### Criteria

"The team can fix the issue when infrastructure monitoring is showing any problems."

### E-commerce App Context (Flutter)

This builds on Item 142. An alert fires: "API 5xx Error Rate is > 5%!" A dashboard is red. Now what? The team needs the **permissions** and **knowledge** (in the form of a "runbook") to actually fix the problem. For an e-commerce app, downtime is lost revenue, so speed is essential.

### How to Achieve This (Flutter/E-commerce)

#### 1. Part 1: The Runbook (Knowledge)

A "runbook" is a simple, step-by-step guide for fixing a specific, common problem. It should be stored in your team wiki, linked directly from your monitoring alerts.

**Example: Runbook for "High API Error Rate"**

* **Alert:** \`[P1] 5xx Error Rate > 5% for 5 minutes\`
* **Link to this Runbook:** \`[link-to-wiki-page]\`

---

**Playbook: How to Triage High API Errors**

1.  **Check the Dashboard:** Open the [Infrastructure Health Dashboard](link) to see *which* endpoint is failing (e.g., \`POST /checkout\`).
2.  **Check the Logs:** Open [GCP/Datadog Logs](link) and filter for \`status:error\` and the failing endpoint.
    * *What is the error message? Is it "Database connection pool exhausted"? "Payment gateway timeout"?*
3.  **Check for Bad Deployments:** Go to the [CI/CD Deployments](link) dashboard.
    * *Was a new backend service deployed in the last 15 minutes?*
    * **If YES:** This is the likely cause. **Proceed to "Fix" step.**
4.  **Check 3rd Parties:** Go to the [Stripe Status Page](link) or [Payment Provider Status](link).
    * *Are they reporting an outage?*
    * **If YES:** The issue is external. Post in the team channel and monitor.

**Fix: How to Roll Back a Bad Backend Deployment**

1.  Go to your [CI/CD Server (e.g., ArgoCD, GitHub Actions)](link).
2.  Find the *previous* successful deployment.
3.  Click the **"Rollback"** or **"Re-deploy"** button for that old version.
4.  Monitor the error rate dashboard. It should return to normal within 5 minutes.
5.  Post in Slack: "Rolled back backend service \`checkout-api\` to version \`1.2.3\` to mitigate high error rate. Investigating root cause."

#### 2. Part 2: The Permissions (Access)

* Your developers (or at least the on-call tech leads) must have the **permissions** to execute the runbook.
* This means they need permissions in your CI/CD tool (e.g., ArgoCD, GitHub Actions) to **trigger a deployment or rollback**.
* This *also* reinforces Item 139 (IaC). The fix is *not* to SSH into a server. The fix is to use the CI/CD tool to re-deploy a stable version, which is a much safer, audited action.
`,
        '144-Application_Incident_Response.md': `
# Maturity Level 4: Continuous Monitoring

**Area:** Architecture Execution
**Practice:** Continuous Monitoring
**Phase:** RELEASE
**Index:** 144

---

### Criteria

"The team can fix the issue when application monitoring is showing any problems."

### E-commerce App Context (Flutter)

This is the **Flutter-specific** version of Item 143. An alert fires: "New Crash in \`checkout.dart\`!" or "Crash-Free Rate for v1.3.0 dropped to 98%!" The Flutter team needs to be able to
1.  Understand the crash report.
2.  Find the bad code.
3.  Deploy a fix (a "hotfix").

### How to Achieve This (Flutter/E-commerce)

#### 1. Required Tooling

* **Error Monitoring:** **Firebase Crashlytics** or **Sentry**.
* **Source Maps (\`.dSYM\` / Proguard):** You *must* be uploading your debug symbols to Crashlytics/Sentry on every build. If you don't, your stack traces will be obfuscated and useless.
* **CI/CD:** Your automated \`fastlane\` or CI/CD pipeline (from Item 137).

#### 2. Implementation Steps

1.  **Step 1: Configure Proactive Alerting**
    * In Firebase Crashlytics, go to **Alerts**.
    * Enable alerts for:
        * **"New, high-impact issue"**: Alerts you when a brand new, high-velocity crash appears.
        * **"Regression"**: Alerts you when a crash you previously marked "closed" reappears.
    * Route these alerts *directly* to a team Slack/Teams channel (e.g., \`#flutter-crashes\`).

2.  **Step 2: Train the Team to Read Stack Traces**
    * This is a critical skill. All Flutter developers must be able to open a Crashlytics report and understand it.
    * **Key things to look for:**
        * **The exact line:** \`checkout_bloc.dart:152\` (This is why debug symbols are essential).
        * **The exception:** \`NullPointerException: 'cart.total' was called on null\`.
        * **Context:** Is it only on "iOS 17"? Is it only on "Samsung devices"?
        * **"Breadcrumbs":** Sentry and others provide a log of user actions *before* the crash (e.g., "User tapped 'Apply Coupon'," "Network request to \`/coupons\` failed," *then* crash).

3.  **Step 3: Define the "Hotfix" Process**
    * When a P1 crash is identified, the team needs a documented "hotfix" plan.
    * **Process:**
        1.  **"Stop the Line"**: The Tech Lead declares a "P1 Hotfix." All non-essential work stops.
        2.  **Create Hotfix Branch:** A developer creates a \`hotfix/P-456-checkout-crash\` branch from the \`release/v1.3.0\` tag (or \`main\`, depending on your strategy).
        3.  **Fix & Verify:** The developer writes the fix (e.g., \`if (cart != null) { ... }\`) AND a unit test that would have caught the bug (see Item 157).
        4.  **PR & Merge:** The PR is reviewed *immediately* by the Tech Lead and merged into the release branch and \`main\`.
        5.  **Deploy:** The developer **triggers the "One-Click Production Deployment"** workflow (from Item 137) to build \`v1.3.1\` and upload it to the stores.
        6.  **Request Expedited Review:** For iOS, you must request an "Expedited Review" from Apple, explaining that the update fixes a critical crash.
`,
        '145-Business_Monitoring_Tools.md': `
# Maturity Level 4: Continuous Monitoring

**Area:** Architecture Execution
**Practice:** Continuous Monitoring
**Phase:** RELEASE
**Index:** 145

---

### Criteria

"There are business monitoring tools for production and there is a team in charge of following up."

### E-commerce App Context (Flutter)

This is about monitoring *business success*, not just technical health. An app that is 100% crash-free but has 0 checkouts is a total failure. You need to track Key Performance Indicators (KPIs) in real-time, and someone must be responsible for watching them.

### How to Achieve This (Flutter/E-commerce)

#### 1. Required Tooling

* **Analytics:** **Firebase Analytics** (via \`firebase_analytics\` package), **Segment**, or **Amplitude**.
* **Data Warehouse (Optional but best):** **BigQuery** (links to Firebase for free).
* **BI/Dashboard Tool:** **Looker Studio** (formerly Google Data Studio, free), **Tableau**, or **Amplitude/Segment**'s built-in dashboards.

#### 2. Implementation Steps

1.  **Step 1: Instrument Key Business Events in Flutter**
    * Your Flutter app *must* send analytics events for the core e-commerce funnel. Use the \`firebase_analytics\` package.
    * **Events to send:**
        * \`logViewItemList(itemListId: 'category_shoes', itemListName: 'Shoe Category')\`
        * \`logViewItem(itemId: 'SKU-123', itemName: 'Red Sneaker', itemCategory: 'Shoes')\`
        * \`logAddToCart(itemId: 'SKU-123', quantity: 1, price: 99.99, currency: 'USD')\`
        * \`logBeginCheckout()\`
        * \`logAddPaymentInfo()\`
        * \`logPurchase(value: 105.99, currency: 'USD', transactionId: 'T-12345')\`

2.  **Step 2: Assign Responsibility**
    * This is a non-technical role. The **Product Owner (PO)** or a dedicated **Business Analyst** is the "team in charge of following up."
    * Their job is to look at these dashboards *every day*.

3.  **Step 3: Build the Business Dashboard**
    * The PO or analyst connects the BI tool (e.g., Looker Studio) to the data source (Firebase Analytics or BigQuery).
    * They create a dashboard (e.g., "E-commerce Daily KPIs") with key charts:
        * **The Funnel:** A funnel visualization showing:
            1.  \`view_item\` (Users)
            2.  \`add_to_cart\` (Users)
            3.  \`begin_checkout\` (Users)
            4.  \`purchase\` (Users)
        * **Core Metrics (Today vs. Same Day Last Week):**
            * Daily Active Users (DAU)
            * Total \`purchase\` events (Conversions)
            * Total \`value\` from \`purchase\` (Revenue)
            * Average Order Value (AOV)

4.  **Step 4: The "Follow Up" Process**
    * The PO's daily routine:

        4.  **The PO immediately pings the Tech Lead** in Slack: "@TechLead, I'm seeing a huge, sudden drop in \`purchase\` events on the business dashboard. Can you check the infrastructure/app monitoring (Items 142/144) to see if something is broken?"
